<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn a photo of your pet into a crochet tapestry or blanket pattern." />
    <meta name="theme-color" content="#f7efe2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241b16" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M36 33c4 5 7 7 10 11' fill='none' stroke='%23a85230' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='23' r='17' fill='%23a85230'/%3E%3Cg fill='none' stroke='%23fffaf2' stroke-width='2.2' stroke-linecap='round' opacity='.85'%3E%3Cpath d='M9 18c8-6 20-7 29 1'/%3E%3Cpath d='M7 25c9-7 23-7 32 2'/%3E%3Cpath d='M11 33c8-7 19-7 26 0'/%3E%3Cpath d='M19 7c-5 9-4 22 3 32'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Cozy Tapestry — turn your pet into a crochet pattern</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cozy Tapestry" />
    <meta property="og:description" content="Turn a photo of your pet into a crochet tapestry or blanket pattern: chart, yarn list, row-by-row instructions and a printable PDF. Free, and your photo never leaves your device." />
    <meta property="og:url" content="https://maridream.github.io/cozy-tapestry/" />
    <meta property="og:image" content="https://maridream.github.io/cozy-tapestry/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art cat crochet chart beside the words Cozy Tapestry" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply a saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('cozy-theme');
        if (t === 'cottage' || t === 'fireside') {
          document.documentElement.setAttribute('data-theme', t);
          var c = t === 'fireside' ? '#241b16' : '#f7efe2';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', c);
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
